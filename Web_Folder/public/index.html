<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Data Forensic Verification</title>
    <style>
        /* --- THEME VARIABLES --- */
        :root[data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent-red: #c70000; /* Deep Red */
            --accent-gold: #d4af37; /* Metallic Gold */
            --border-color: #e0e0e0;
            /* Header Gradient: Black to Deep Red */
            --header-bg: linear-gradient(135deg, #000000 0%, #5a0000 100%);
            --card-shadow: 0 15px 35px rgba(0,0,0,0.1);
            --pattern-opacity: 0.03;
        }

        :root[data-theme="dark"] {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-red: #ff3333; /* Brighter Red for dark mode */
            --accent-gold: #ffd700; /* Bright Gold */
            --border-color: #333333;
            /* Header Gradient: Deep Black to Darker Red */
            --header-bg: linear-gradient(135deg, #000000 0%, #3a0000 100%);
            --card-shadow: 0 15px 35px rgba(0,0,0,0.5);
            --pattern-opacity: 0.08;
        }

        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
            /* Subtle circuit pattern overlay for forensic look */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.627 0l.83.828-1.415 1.415L51.8 0h2.827zM5.373 0l-.83.828 1.415 1.415L8.2 0H5.373zM60 5.373l-.828-.83-1.415 1.415L60 8.2V5.373zM0 5.373l.828-.83 1.415 1.415L0 8.2V5.373zM0 54.627l.828.83 1.415-1.415L0 51.8v2.827zM60 54.627l-.828.83-1.415-1.415L60 51.8v2.827zM5.373 60l-.83-.828 1.415-1.415L8.2 60H5.373zM54.627 60l.83-.828-1.415-1.415L51.8 60h2.827z' fill='%239C92AC' fill-opacity='0.4' fill-rule='evenodd'/%3E");
        }

        /* --- THEME TOGGLE BUTTON --- */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            font-size: 20px;
            transition: all 0.3s ease;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent-gold);
        }

        /* --- MAIN CARD --- */
        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* --- HEADER SECTION --- */
        .header {
            background: var(--header-bg);
            color: white;
            padding: 35px 20px;
            text-align: center;
            position: relative;
            /* Gold trim at bottom of header */
            border-bottom: 3px solid var(--accent-gold);
        }

        .header-logo {
            width: 100px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(to right, #ffffff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        /* --- CONTENT SECTION --- */
        .content {
            padding: 30px;
        }

        /* --- STATUS BADGES (Updated Colors) --- */
        .status-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            border-radius: 4px; /* Sharper corners for modern look */
            font-weight: 700;
            font-size: 16px;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .valid {
            /* Gold Theme for Valid */
            background-color: rgba(212, 175, 55, 0.15); 
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
        }

        .invalid {
            /* Red Theme for Invalid */
            background-color: rgba(199, 0, 0, 0.15);
            color: var(--accent-red);
            border: 2px solid var(--accent-red);
        }

        /* --- DETAILS TABLE --- */
        .details-box {
            background: rgba(128, 128, 128, 0.05); /* Subtle background */
            border-radius: 8px;
            padding: 25px;
            border: 1px solid var(--border-color);
            position: relative;
        }
        /* Little tech accent corners */
        .details-box::before, .details-box::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border: 2px solid var(--accent-gold);
        }
        .details-box::before { top: -1px; left: -1px; border-bottom: none; border-right: none; }
        .details-box::after { bottom: -1px; right: -1px; border-top: none; border-left: none; }


        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 700;
            text-align: right;
            font-family: 'Consolas', monospace; /* Monospace font for data look */
        }

        /* --- LOADING SPINNER --- */
        .loader {
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }

        /* --- FOOTER & EASTER EGG --- */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* The hidden text style */
        .easter-egg {
            font-size: 7px; /* Tiny font */
            opacity: 0.08;  /* Extremely low opacity - barely visible */
            margin-top: 8px;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Dark/Light Mode">
        🌓
    </button>

<div class="card">
    <div class="header">
        <img src="forensic_logo.png" alt="Legal Data Forensic Logo" class="header-logo" onerror="this.style.display='none'">
        <h1>Legal Data Forensic</h1>
        <p>Official Document Verification</p>
    </div>

    <div class="content">
        <div id="loading">
            <div class="loader"></div>
            <p style="text-align:center; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;">Accessing Secure Registry...</p>
        </div>

        <div id="result" class="hidden">
            
            <div class="status-container">
                <div id="status-badge" class="status-badge"></div>
            </div>

            <div id="details-container" class="hidden details-box">
                <div class="detail-row"><span class="label">Reference ID</span> <span class="value" id="d-ref"></span></div>
                <div class="detail-row"><span class="label">Credential Type</span> <span class="value" id="d-type" style="color: var(--accent-gold);"></span></div>
                <div class="detail-row"><span class="label">Issued To</span> <span class="value" id="d-name"></span></div>
                <div class="detail-row"><span class="label">Purpose</span> <span class="value" id="d-purpose"></span></div>
                <div class="detail-row"><span class="label">Date Issued</span> <span class="value" id="d-issue"></span></div>
                <div class="detail-row"><span class="label">Valid Until</span> <span class="value" id="d-expiry"></span></div>
            </div>

            <div id="error-msg" class="hidden" style="margin-top: 25px; text-align: center; color: var(--accent-red); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;"></div>
        </div>

        <div class="footer">
            <p>SECURE FORENSIC DATA SYSTEM © 2026</p>
            <p class="easter-egg">Made by Ashwin and Laxmikant</p>
        </div>
    </div>
</div>

<script>
    // --- THEME TOGGLE LOGIC ---
    const toggleBtn = document.getElementById('theme-toggle');
    const rootElem = document.documentElement;
    // Check local storage or prefer-color-scheme
    let currentTheme = localStorage.getItem('theme') || 
                       (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    
    // Apply initial theme
    rootElem.setAttribute('data-theme', currentTheme);

    toggleBtn.addEventListener('click', () => {
        // Switch theme
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        rootElem.setAttribute('data-theme', currentTheme);
        // Save preference
        localStorage.setItem('theme', currentTheme);
    });


    // --- VERIFICATION LOGIC (Unchanged from previous robust version) ---
    async function verify() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            showError("ERR_NO_ID: No Document Identification detected.");
            return;
        }

        try {
            const response = await fetch(`/api/verify?id=${id}`);
            const data = await response.json();

            if (!data.document) {
                showError("ERR_NOT_FOUND: Document absent from official registry.");
                return;
            }

            const doc = data.document;
            
            // Date Check Logic (DD-MM-YYYY)
            if (doc.expiry_date.includes("Lifetime") || doc.expiry_date.includes("N/A")) {
                showSuccess(doc);
            } else {
                const parts = doc.expiry_date.split('-');
                // new Date(year, monthIndex, day)
                const expDate = new Date(parts[2], parts[1] - 1, parts[0]);
                const today = new Date();
                today.setHours(0,0,0,0);

                if (today > expDate) {
                    showError(`STATUS: EXPIRED ON ${doc.expiry_date}`, doc);
                } else {
                    showSuccess(doc);
                }
            }

        } catch (err) {
            console.error(err);
            showError("ERR_NETWORK: Connection to registry failed.");
        }
    }

    function showSuccess(doc) {
        hideLoader();
        
        const badge = document.getElementById('status-badge');
        badge.className = "status-badge valid";
        // Using a slightly more "tech" looking checkmark SVG
        badge.innerHTML = `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59L9 16.17Z" fill="currentColor"/>
            </svg>
            AUTHENTICATED & VALID
        `;

        fillDetails(doc);
    }

    function showError(msg, doc = null) {
        hideLoader();

        const badge = document.getElementById('status-badge');
        badge.className = "status-badge invalid";
        // Using a slightly more "tech" looking X SVG
        badge.innerHTML = `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z" fill="currentColor"/>
            </svg>
            INVALID / EXPIRED
        `;

        const errorText = document.getElementById('error-msg');
        errorText.innerText = msg;
        errorText.classList.remove('hidden');

        if (doc) {
            fillDetails(doc);
        }
    }

    function fillDetails(doc) {
        const container = document.getElementById('details-container');
        container.classList.remove('hidden');
        
        // Use 'N/A' if data is missing, convert type to uppercase
        document.getElementById('d-ref').innerText = doc.ref_no || "N/A";
        document.getElementById('d-type').innerText = (doc.type || "Document").toUpperCase(); 
        document.getElementById('d-name').innerText = doc.issued_to || "N/A";
        document.getElementById('d-purpose').innerText = doc.purpose || "N/A";
        document.getElementById('d-issue').innerText = doc.issue_date || "N/A";
        document.getElementById('d-expiry').innerText = doc.expiry_date || "N/A";
    }

    function hideLoader() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
    }

    // Start Verification
    verify();
</script>

</body>
</html>
