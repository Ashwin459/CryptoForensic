<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFT Verification Portal</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid #eee;
        }

        /* --- THEME HEADER (GRADIENT) --- */
        .header {
            background: linear-gradient(135deg, #4b36cc 0%, #b030b0 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* CONTENT */
        .content {
            padding: 30px;
        }

        /* STATUS BADGES */
        .status-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            gap: 10px;
        }

        .valid {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #22c55e;
        }

        .invalid {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        /* DETAILS TABLE */
        .details-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
        }

        .value {
            color: #1e293b;
            font-size: 15px;
            font-weight: 700;
            text-align: right;
        }

        /* LOADING */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4b36cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Crypto Forensic Technology</h1>
        <p>Document Verification System</p>
    </div>

    <div class="content">
        <div id="loading">
            <div class="loader"></div>
            <p style="text-align:center; color: #64748b; font-weight: 500;">Searching Registry...</p>
        </div>

        <div id="result" class="hidden">
            
            <div class="status-container">
                <div id="status-badge" class="status-badge"></div>
            </div>

            <div id="details-container" class="hidden details-box">
                <div class="detail-row"><span class="label">Reference No.</span> <span class="value" id="d-ref"></span></div>
                <div class="detail-row"><span class="label">Document Type</span> <span class="value" id="d-type" style="color:#4b36cc;"></span></div>
                <div class="detail-row"><span class="label">Issued To</span> <span class="value" id="d-name"></span></div>
                <div class="detail-row"><span class="label">Purpose</span> <span class="value" id="d-purpose"></span></div>
                <div class="detail-row"><span class="label">Date Issued</span> <span class="value" id="d-issue"></span></div>
                <div class="detail-row"><span class="label">Valid Until</span> <span class="value" id="d-expiry"></span></div>
            </div>

            <div id="error-msg" class="hidden" style="margin-top: 20px; text-align: center; color: #ef4444; font-weight: 600;"></div>
        </div>

        <div class="footer">
            SECURE VERIFICATION SYSTEM &copy; 2026
        </div>
    </div>
</div>

<script>
    async function verify() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            showError("No Document ID detected in URL.");
            return;
        }

        try {
            // CALL YOUR API
            const response = await fetch(`/api/verify?id=${id}`);
            const data = await response.json();

            if (!data.document) {
                showError("Document Not Found in Official Registry.");
                return;
            }

            const doc = data.document;
            
            // --- DATE CHECK LOGIC (DD-MM-YYYY) ---
            if (doc.expiry_date.includes("Lifetime") || doc.expiry_date.includes("N/A")) {
                showSuccess(doc); // Always valid
            } else {
                // Parse "DD-MM-YYYY" manually
                const parts = doc.expiry_date.split('-');
                // Create Date object (yyyy, mm-1, dd)
                const expDate = new Date(parts[2], parts[1] - 1, parts[0]);
                const today = new Date();
                today.setHours(0,0,0,0);

                if (today > expDate) {
                    showError(`This document EXPIRED on ${doc.expiry_date}`, doc);
                } else {
                    showSuccess(doc);
                }
            }

        } catch (err) {
            console.error(err);
            showError("Network Connection Failed. Please reload.");
        }
    }

    function showSuccess(doc) {
        hideLoader();
        
        const badge = document.getElementById('status-badge');
        badge.className = "status-badge valid";
        badge.innerHTML = `
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            OFFICIALLY VALID
        `;

        fillDetails(doc);
    }

    function showError(msg, doc = null) {
        hideLoader();

        const badge = document.getElementById('status-badge');
        badge.className = "status-badge invalid";
        badge.innerHTML = `
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            INVALID / EXPIRED
        `;

        const errorText = document.getElementById('error-msg');
        errorText.innerText = msg;
        errorText.classList.remove('hidden');

        if (doc) {
            fillDetails(doc);
        }
    }

    function fillDetails(doc) {
        const container = document.getElementById('details-container');
        container.classList.remove('hidden');
        
        document.getElementById('d-ref').innerText = doc.ref_no || "N/A";
        document.getElementById('d-type').innerText = (doc.type || "Document").toUpperCase(); // Show Type
        document.getElementById('d-name').innerText = doc.issued_to || "N/A";
        document.getElementById('d-purpose').innerText = doc.purpose || "N/A";
        document.getElementById('d-issue').innerText = doc.issue_date || "N/A";
        document.getElementById('d-expiry').innerText = doc.expiry_date || "N/A";
    }

    function hideLoader() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
    }

    // Start
    verify();
</script>

</body>
</html>
